<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Page not found - MurOS</title>
<meta name="description" content="The page you were looking for does not exist.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="manifest" href="/site.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/app.css">
<script>(function(){try{var t=localStorage.getItem("muros-theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.classList.add("dark");}}catch(e){}})();</script>
</head>
<body class="bg-white text-slate-900 antialiased">
<a href="#main" class="skip-link">Skip to content</a>
<header class="border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="/index.html" class="flex items-center gap-2.5" aria-label="MurOS home">
      <img src="/assets/logo-dark.svg" alt="MurOS" class="block h-11 w-auto">
      <span class="mono text-base font-bold text-amber-700 -ml-2">[BETA]</span>
    </a>
    <button type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme" class="theme-toggle inline-flex items-center justify-center h-8 px-3 rounded border border-slate-300 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50"><span class="theme-label-dark">Dark</span><span class="theme-label-light">Light</span></button>
  </div>
</header>
<main id="main" tabindex="-1" class="max-w-6xl mx-auto px-6 py-24 text-center">
  <p class="mono text-sm text-amber-700">404</p>
  <h1 class="mt-2 text-3xl lg:text-4xl font-bold tracking-tight">Page not found</h1>
  <p class="mt-3 text-slate-600">The page you were looking for does not exist or has moved.</p>
  <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
    <a href="/index.html" class="bg-slate-900 text-white px-4 py-2 rounded text-sm font-medium hover:bg-slate-800">Back to home</a>
    <a href="/features.html" class="border border-slate-300 px-4 py-2 rounded text-sm font-medium hover:bg-slate-50">Features</a>
    <a href="/docs/quickstart.html" class="border border-slate-300 px-4 py-2 rounded text-sm font-medium hover:bg-slate-50">Documentation</a>
    <a href="https://github.com/murosorg/muros" class="border border-slate-300 px-4 py-2 rounded text-sm font-medium hover:bg-slate-50">GitHub</a>
  </div>
</main>
<script src="/assets/theme.js"></script>
</body>
</html>
