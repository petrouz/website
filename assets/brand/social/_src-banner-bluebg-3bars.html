<!doctype html><html><head><meta charset="utf-8"><style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1584px;height:396px}
 body{position:relative;overflow:hidden}
 .bg{position:absolute;inset:0;background:
   radial-gradient(1200px 500px at 88% 50%, rgba(255,244,26,.06), transparent 60%),
   linear-gradient(120deg,#1b2333 0%, #20283b 55%, #1a212f 100%);}
 .bars{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:66px}
 .b{width:100%;height:52px;background:#fff41a;border-radius:14px;opacity:.60}
</style></head><body>
 <div class="bg"></div>
 <div class="bars"><div class="b"></div><div class="b"></div><div class="b"></div></div>
</body></html>
