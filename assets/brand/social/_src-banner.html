<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1584px;height:396px}
  body{font-family:'Inter',Arial,sans-serif;background:#1f2638;color:#fff;overflow:hidden;position:relative}
  .bg{position:absolute;inset:0;background:
     radial-gradient(1200px 500px at 88% 50%, rgba(255,244,26,.06), transparent 60%),
     linear-gradient(120deg,#1b2333 0%, #20283b 55%, #1a212f 100%);}
  .motif{position:absolute;right:70px;top:50%;transform:translateY(-50%);opacity:.10}
  .motif .b{height:34px;border-radius:8px;background:#fff41a;margin:18px 0}
  .motif .b1{width:360px}.motif .b2{width:270px}.motif .b3{width:180px}
  .hairline{position:absolute;left:0;right:0;bottom:0;height:6px;background:#fff41a}
  .lockup{position:absolute;left:96px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:34px}
  .mark{display:flex;flex-direction:column;gap:11px}
  .mark .b{height:22px;border-radius:6px;background:#fff41a}
  .mark .m1{width:86px}.mark .m2{width:65px}.mark .m3{width:45px}
  .word{font-weight:800;font-size:112px;letter-spacing:-5px;line-height:.9}
  .word .os{color:#fff41a}
</style></head>
<body>
  <div class="bg"></div>
  <div class="motif"><div class="b b1"></div><div class="b b2"></div><div class="b b3"></div></div>
  <div class="lockup">
    <div class="mark"><div class="b m1"></div><div class="b m2"></div><div class="b m3"></div></div>
    <div class="word">Mur<span class="os">OS</span></div>
  </div>
  <div class="hairline"></div>
</body></html>
