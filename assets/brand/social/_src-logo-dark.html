<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
 *{margin:0;padding:0;box-sizing:border-box}
 html,body{width:1000px;height:1000px}
 body{font-family:'Inter',Arial,sans-serif;background:#1f2638;display:flex;align-items:center;justify-content:center}
 .card{display:flex;flex-direction:column;align-items:center;gap:46px}
 .mark{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
 .mark .b{height:46px;border-radius:13px;background:#fff41a}
 .m1{width:300px}.m2{width:228px}.m3{width:156px}
 .word{font-weight:800;font-size:170px;letter-spacing:-7px;color:#fff;line-height:1}
 .word .os{color:#fff41a}
</style></head><body>
 <div class="card">
  <div class="mark"><div class="b m1"></div><div class="b m2"></div><div class="b m3"></div></div>
  <div class="word">Mur<span class="os">OS</span></div>
 </div>
</body></html>
