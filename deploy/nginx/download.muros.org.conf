server {
    listen 80;
    listen [::]:80;
    server_name download.muros.org;
    root /opt/muros/download;
    index index.html;

    access_log /var/log/nginx/download.muros.org.access.log;
    error_log /var/log/nginx/download.muros.org.error.log;

    set_real_ip_from 10.10.10.40;
    real_ip_header X-Forwarded-For;

    # Allow the muros.org site to read apt metadata for the version banner.
    location ^~ /dists/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri $uri/ =404;
        autoindex on;
    }

    location ^~ /conf/ { deny all; }
    location ^~ /db/ { deny all; }

    # HTML pages must always revalidate so content changes appear without a
    # manual cache clear. Static assets are versioned via ?v= and stay cached.
    location = / { add_header Cache-Control "no-cache" always; try_files /index.html =404; }
    location ~* \.html$ { add_header Cache-Control "no-cache" always; }

    location / {
        try_files $uri $uri/ =404;
        autoindex on;
    }

    location = /robots.txt { log_not_found off; access_log off; allow all; }
}
