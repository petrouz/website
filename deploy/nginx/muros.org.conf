server {
    listen 80;
    listen [::]:80;
    server_name muros.org www.muros.org;
    root /opt/muros/site;
    index index.html;

    access_log /var/log/nginx/muros.org.access.log;
    error_log /var/log/nginx/muros.org.error.log;

    # Site uses no powerful web features; declare it so browsers never prompt
    # for local network access, geolocation, camera, mic, USB, etc.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), hid=(), serial=(), bluetooth=(), local-network-access=()" always;

    set_real_ip_from 10.10.10.40;
    real_ip_header X-Forwarded-For;

    location / {
        # HTML pages always revalidate so updates show up without a manual
        # cache clear. add_header here drops inherited ones, so re-declare the
        # Permissions-Policy. Versioned assets are cached by the regex below.
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), usb=(), hid=(), serial=(), bluetooth=(), local-network-access=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    location = /robots.txt { log_not_found off; access_log off; allow all; }
    location ~* \.(css|gif|ico|jpeg|jpg|js|png|svg|woff|woff2)$ { expires max; log_not_found off; }
}
